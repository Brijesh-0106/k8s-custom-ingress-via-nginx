---
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-ingress-config
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }

    http {
      server {
        listen 80;
        server_name _;

        location / {
          proxy_pass http://frontend-service:5173/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
          proxy_pass http://backend-service:3001/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-ingress
  template:
    metadata:
      labels:
        app: custom-ingress
    spec:
      containers:
        - name: ingress
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: custom-ingress-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: custom-ingress-config
          configMap:
            name: custom-ingress-config
