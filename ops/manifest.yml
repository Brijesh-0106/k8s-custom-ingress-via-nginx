apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-tut
  template:
    metadata:
      labels:
        app: k8s-tut
    spec:
      containers:
        - name: mongo
          image: mongo
          ports:
            - containerPort: 80
